<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShantiShare - List an Item</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.5; }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.25rem; color: #2563eb; text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; font-size: 0.875rem; font-weight: 500; }
        .nav-links a { color: #64748b; text-decoration: none; }
        .container { max-width: 600px; margin: 2rem auto; padding: 2rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; color: #0f172a; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #334155; }
        input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        textarea { resize: vertical; height: 100px; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-size: 1rem; font-weight: 500; cursor: pointer; width: 100%; }
        .btn:hover { background-color: #1d4ed8; } .nav-links a.active { color: #2563eb; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ShantiShare</a>
        <div class="nav-links">
            <a href="index.html">Browse Items</a>
            <a href="circle.html">My Circle</a>
            <a href="add.html" class="active">List an Item</a>
            <a href="skills.html">Skill Directory</a>
        </div>
    </header>

    <div class="container">
        <h1>Share an Item with Your Neighborhood</h1>
        <form id="addItemForm">
            <div class="form-group">
                <label for="title">Item Name</label>
                <input type="text" id="title" required placeholder="e.g., Pressure Washer, Ladder">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="Hardware & Tools">Hardware & Tools</option>
                    <option value="Medical Aid">Medical Aid</option>
                    <option value="Gardening">Gardening</option>
                    <option value="Domestic">Domestic</option>
                </select>
            </div>
            <div class="form-group">
                <label for="owner">Your Name & Location</label>
                <input type="text" id="owner" required placeholder="e.g., Rohit S. (Block D)">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" required placeholder="Describe condition, features, or rules for borrowing..."></textarea>
            </div>
            <button type="submit" class="btn">List Item</button>
        </form>
    </div>

    <script>
        document.getElementById('addItemForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                owner: document.getElementById('owner').value,
                description: document.getElementById('description').value
            };

            // Get existing items from localStorage or start empty
            let items = JSON.parse(localStorage.getItem('communityItems')) || [];
            items.push(newItem);
            localStorage.setItem('communityItems', JSON.stringify(items));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
